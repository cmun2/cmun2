name: Update profile README

# 블로그 글과 공개 활동에서 다시 읽어온다.
# 실제로 바뀐 게 없으면 커밋하지 않는다 — 잔디를 채우려고 도는 워크플로가 아니다.
on:
  schedule:
    - cron: "30 22 * * *"   # 매일 07:30 KST
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild README sections
        run: python build.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet README.md; then
            echo "변경 없음 — 커밋하지 않는다"
            exit 0
          fi
          git add README.md
          git commit -m "Update README with latest posts and activity"
          git push
